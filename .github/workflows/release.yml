name: Build and release

# Two ways to publish a release:
#  - Push a tag like v0.6.1, or
#  - Actions tab -> "Build and release" -> Run workflow, and enter a version such as v0.6.1.
# Leave the version empty to only build the zips (downloadable as build artifacts).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. v0.6.1 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the desktop app (self-contained, no .NET needed on the user's PC)
        shell: pwsh
        run: >
          dotnet publish desktop/ProofmarkDesktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/Proofmark-Desktop

      - name: Put the engine and icon next to the exe (the app loads them from its folder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/Proofmark-Desktop/engine | Out-Null
          Copy-Item desktop/engine/engine.js -Destination out/Proofmark-Desktop/engine/engine.js -Force
          Copy-Item desktop/proofmark.ico -Destination out/Proofmark-Desktop/proofmark.ico -Force

      - name: Check the build output
        shell: pwsh
        run: |
          foreach ($f in @("out/Proofmark-Desktop/ProofmarkDesktop.exe", "out/Proofmark-Desktop/engine/engine.js", "out/Proofmark-Desktop/proofmark.ico")) {
            if (-not (Test-Path $f)) { throw "Missing from build output: $f" }
          }
          Get-ChildItem -Recurse out/Proofmark-Desktop | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Package zips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, staging | Out-Null
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md -Destination out/Proofmark-Desktop
          Compress-Archive -Path out/Proofmark-Desktop -DestinationPath dist/Proofmark-Desktop-win-x64.zip
          Copy-Item -Path extension -Destination staging/proofmark-extension -Recurse
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md -Destination staging/proofmark-extension
          Compress-Archive -Path staging/proofmark-extension -DestinationPath dist/proofmark-extension.zip
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proofmark-release
          path: dist/*.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Proofmark ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.zip
          body: |
            ## Downloads

            - **proofmark-extension.zip** — browser extension for Chrome, Edge, Brave and Arc (Windows, macOS, Linux).
            - **Proofmark-Desktop-win-x64.zip** — Windows 10/11 (64-bit) desktop app. No .NET install needed.

            Install steps are in the [README](https://github.com/${{ github.repository }}#readme).

            The Windows app isn't code-signed, so the first launch may show "Windows protected your PC". Click **More info** → **Run anyway**.
